# Pixel Buds Pro for Noctalia
# Controls Google Pixel Buds Pro (battery, ANC modes, EQ, in-ear detection).

id = "jazden/pixelbudspro"
name = "Pixel Buds Pro"
version = "1.0.0"
plugin_api = 24
author = "jazden"
license = "MIT"
icon = "headphones"
description = "Pixel Buds Pro battery monitor, ANC / Transparency modes, and 5-band equalizer in the bar and popup panel."
tags = ["audio", "bar", "panel", "service", "hardware", "indicator"]
dependencies = ["python3"]

[[setting]]
key = "device_mac"
type = "string"
label_key = "settings.device_mac.label"
description_key = "settings.device_mac.description"
default = ""

[[widget]]
id = "pixelbuds"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle jazden/pixelbudspro:panel"
  right = "plugin jazden/pixelbudspro:service all cycle-noise"

  [[widget.setting]]
  key = "hide_when_disconnected"
  type = "bool"
  label_key = "settings.hide_when_disconnected.label"
  description_key = "settings.hide_when_disconnected.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 560
placement = "floating"
position = "top_center"
open_near_click = false

[[service]]
id = "service"
entry = "service.luau"
